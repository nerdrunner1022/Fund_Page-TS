<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahira College Trincomalee – Land Fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Serif+Tamil:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--ink:#1d2b24;--mute:#5b675f;--card:#fffdf8;--line:#d9d2c0;--green:#1f6b4a;--gold:#b8801f;--empty:#e4dcc6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--ink:#eee9db;--mute:#a4b0a8;--card:#1c2b23;--line:#2f4237;--green:#5fc08f;--gold:#e0b04e;--empty:#2a3d32}}
:root[data-theme="dark"]{--bg:#14201a;--ink:#eee9db;--mute:#a4b0a8;--card:#1c2b23;--line:#2f4237;--green:#5fc08f;--gold:#e0b04e;--empty:#2a3d32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 'Source Sans 3','Noto Sans Tamil',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 20px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top small{color:var(--mute)}
button.lang{font:600 15px 'Source Sans 3','Noto Sans Tamil',sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
button.lang:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1{font:800 clamp(28px,6vw,44px)/1.15 'Fraunces','Noto Serif Tamil',serif;margin:28px 0 8px}
.lead{color:var(--mute);margin:0 0 28px;max-width:60ch}
.days{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:18px}
.days b{font:800 clamp(88px,26vw,168px)/.9 'Fraunces',serif;color:var(--green);font-variant-numeric:tabular-nums}
.days span{font:600 22px 'Fraunces','Noto Serif Tamil',serif}
.hms{display:flex;gap:22px;margin:10px 0 0;color:var(--mute);font-variant-numeric:tabular-nums}
.hms div b{color:var(--ink);font-size:24px;margin-right:5px}
.raised{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.raised .amt{font:800 clamp(30px,7vw,46px)/1.1 'Fraunces',serif}
.raised .goal{color:var(--mute);text-align:right}
.land{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:16px 0 8px}
.land i{aspect-ratio:1.5;border-radius:3px;background:var(--empty)}
.land i.f{background:var(--green)}
.land i.p{background:linear-gradient(90deg,var(--green) var(--p),var(--empty) var(--p))}
.note{color:var(--mute);font-size:15px;margin:0}
.pct{font-weight:600;color:var(--gold)}
.how{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.how h2{font:700 22px 'Fraunces','Noto Serif Tamil',serif;margin:0 0 8px}
.how p{margin:0 0 12px}
.how a{display:inline-block;margin:4px 8px 4px 0;padding:9px 16px;border-radius:8px;background:var(--green);color:#fff;text-decoration:none;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .how a{color:#0f1a14}}

};
var lang='en';
try{lang=localStorage.getItem('zlang')||'en'}catch(e){}
function money(n){return 'Rs. '+Math.round(n).toLocaleString('en-US')}
function draw(){
  var t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-k]').forEach(function(e){e.textContent=t[e.dataset.k]});
  document.getElementById('lang').textContent=t.btn;
  document.getElementById('amt').textContent=money(RAISED);
  document.getElementById('goal').textContent=money(GOAL);
  document.getElementById('leftamt').textContent=money(Math.max(GOAL-RAISED,0));
  var r=Math.min(RAISED/GOAL,1),perches=r*40,land=document.getElementById('land');land.innerHTML='';
  for(var i=0;i<40;i++){var c=document.createElement('i'),v=perches-i;
    if(v>=1)c.className='f';else if(v>0){c.className='p';c.style.setProperty('--p',(v*100)+'%')}
    land.appendChild(c)}
  var p=(r*100).toFixed(r>0&&r<.1?1:0);
  document.getElementById('pct').textContent=p+'% '+t.fund;
  land.setAttribute('aria-label',p+'% '+t.fund);
  buildGive();
  tick();
}
function buildGive(){
  var t=T[lang],q=document.getElementById('quick');q.innerHTML='';
  [1000,5000,10000,25000,100000].forEach(function(v){var b=document.createElement('button');b.type='button';b.textContent=v.toLocaleString('en-US');b.onclick=function(){document.getElementById('amtin').value=v;link()};q.appendChild(b)});
  document.getElementById('namein').placeholder=t.name;
  document.getElementById('amtin').placeholder=t.amtph;
  link();
}
function link(){
  var t=T[lang],a=parseInt(document.getElementById('amtin').value,10)||0,n=document.getElementById('namein').value.trim();
  var msg=t.msg.replace('{a}',a>0?money(a):'...').replace('{n}',n||'...');
  document.getElementById('wa').href='https://wa.me/94772976911?text='+encodeURIComponent(msg);
}
document.getElementById('amtin').oninput=link;document.getElementById('namein').oninput=link;
function tick(){
  var ms=Math.max(DEADLINE-new Date(),0),s=Math.floor(ms/1000);
  document.getElementById('d').textContent=Math.floor(s/86400);
  document.getElementById('h').textContent=Math.floor(s%86400/3600);
  document.getElementById('m').textContent=Math.floor(s%3600/60);
  document.getElementById('s').textContent=s%60;
}
document.getElementById('lang').onclick=function(){lang=lang==='en'?'ta':'en';try{localStorage.setItem('zlang',lang)}catch(e){}draw()};
draw();setInterval(tick,1000);
</script>
